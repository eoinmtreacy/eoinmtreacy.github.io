---
layout: default
title: Blog
---
<h1>Blog something</h1>

<ul>
    {% for post in site.posts %}
        <li>
            <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
            <p>{{ post.date | date: "%Y, %B %d" }}</p>
            <p>{{ post.excerpt }}</p>
        </li>
    {% endfor %}
</ul>
